spring.application.name=PayTrack
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/paytrack_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:PayTrackDevelopmentSecretKeyMustBeAtLeast32CharactersLong}
app.jwt.expiration=86400000

app.frontend-url=${FRONTEND_URL:http://localhost:5500}
